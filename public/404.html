<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oja — Good things, chosen well</title>
    <!-- Single Page Apps for GitHub Pages: redirect path to query parameter so index.html loads with 200 OK -->
    <script>
      (function() {
        var pathSegmentsToKeep = 1; // Keep '/Oja' repository name
        var l = window.location;
        var newPath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(newPath);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Oja…</p>
  </body>
</html>
